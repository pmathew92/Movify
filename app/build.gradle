plugins {
    id 'com.android.application'
}

def secretsProperties = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.isFile()) {
    secretsFile.withInputStream { secretsProperties.load(it) }
}
def tmdbApiKey = providers.environmentVariable('TMDB_API_KEY')
        .orElse(secretsProperties.getProperty('TMDB_API_KEY', ''))
        .get().trim()
if (tmdbApiKey.isEmpty()) {
    throw new GradleException('Missing TMDB_API_KEY. Set it in the ignored secrets.properties file or as an environment variable.')
}

android {
    namespace = 'com.movify.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.movify.app'
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'TMDB_API_KEY', groovy.json.JsonOutput.toJson(tmdbApiKey)
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // These AndroidX versions retain support for Android 5.0 (API 21).
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    // Glide 5 requires API 23; 4.16.0 preserves the app's API 21 minimum.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
